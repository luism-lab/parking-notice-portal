<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>StreamVault — Dispute Submitted</title>
<style>
  :root{--bg:#0b0d12; --card:#151822; --text:#eef0f4; --muted:#9aa2b1; --accent:#5b6cff; --ok:#34d399; --line:#242838;}
  *{box-sizing:border-box}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; padding:48px 16px;}
  .wrap{max-width:440px; width:100%}
  .brand{display:flex; align-items:center; gap:8px; margin-bottom:20px}
  .brand .mark{width:26px; height:26px; border-radius:6px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
  .brand .name{font-weight:700; font-size:17px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:0 20px 50px rgba(0,0,0,.35); text-align:center;}
  .check{width:48px; height:48px; border-radius:50%; background:rgba(52,211,153,.12); color:var(--ok); display:flex; align-items:center; justify-content:center; font-size:24px; margin:0 auto 16px;}
  h1{font-size:17px; margin:0 0 8px}
  p{color:var(--muted); font-size:13.5px; line-height:1.55; margin:0 0 6px}
  .ref{font-size:12px; color:var(--muted); margin-top:16px}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><div class="mark">SV</div><div class="name">StreamVault</div></div>
    <div class="card">
      <div class="check">✓</div>
      <h1>Dispute submitted</h1>
      <p>We've received your request. The $47.99 charge will be reversed to your original payment method within 3–5 business days.</p>
      <div class="ref">Reference: SV-DSP-88214</div>
    </div>
  </div>
</body>
</html>
