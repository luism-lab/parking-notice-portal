<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>StreamVault — Verify Identity</title>
<style>
  :root{--bg:#0b0d12; --card:#151822; --text:#eef0f4; --muted:#9aa2b1; --accent:#5b6cff; --accent-dark:#4551d9; --line:#242838; --field:#10131c;}
  *{box-sizing:border-box}
  body{margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; background:var(--bg); color:var(--text); display:flex; justify-content:center; padding:48px 16px;}
  .wrap{max-width:400px; width:100%}
  .brand{display:flex; align-items:center; gap:8px; margin-bottom:20px}
  .brand .mark{width:26px; height:26px; border-radius:6px; background:var(--accent); display:flex; align-items:center; justify-content:center; font-weight:800; font-size:13px;}
  .brand .name{font-weight:700; font-size:17px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; box-shadow:0 20px 50px rgba(0,0,0,.35);}
  h1{font-size:17px; margin:0 0 4px}
  .sub{color:var(--muted); font-size:13px; margin:0 0 20px}
  label{display:block; font-size:12.5px; color:var(--muted); margin:12px 0 6px}
  input{width:100%; padding:11px 12px; border-radius:8px; border:1px solid var(--line); background:var(--field); color:var(--text); font-size:14px; font-family:inherit;}
  input:focus{outline:none; border-color:var(--accent)}
  .btn{display:block; width:100%; text-align:center; background:var(--accent); color:#fff; padding:14px; border:none; border-radius:9px; font-size:15px; font-weight:600; cursor:pointer; margin-top:20px;}
  .btn:hover{background:var(--accent-dark)}
  .btn[disabled]{opacity:.7; cursor:default}
  .lock{font-size:11.5px; color:var(--muted); text-align:center; margin-top:12px}
  #result{display:none; margin-top:18px; padding:14px; border-radius:9px; background:#0f2a20; border:1px solid #34d399; font-size:12.5px; color:#bdf5dc; white-space:pre-wrap; word-break:break-word;}
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><div class="mark">SV</div><div class="name">StreamVault</div></div>
    <div class="card">
      <h1>Verify your identity</h1>
      <p class="sub">Sign in again to continue disputing charge SV-CHG-88214.</p>

      <form id="loginForm">
        <label>Email address</label>
        <input type="email" id="email" autocomplete="off" required>
        <label>Password</label>
        <input type="password" id="password" autocomplete="off" required>
        <button type="submit" class="btn" id="submitBtn">Verify &amp; continue</button>
        <div class="lock">🔒 Simulated locally — no data is transmitted</div>
      </form>

      <div id="result"></div>
    </div>
  </div>

<script>
  document.getElementById('loginForm').addEventListener('submit', function (e) {
    e.preventDefault();
    var captured = {
      email: document.getElementById('email').value,
      password: document.getElementById('password').value,
      capturedAt: new Date().toISOString()
    };
    try {
      localStorage.setItem('streamvault_support_capture', JSON.stringify(captured));
    } catch (err) { /* localStorage may be unavailable; ignore */ }
    console.log('[TEST] Credentials submitted in the form:', captured);

    var btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.textContent = 'Verifying…';

    setTimeout(function () {
      window.location.href = 'confirmation.html';
    }, 900);
  });
</script>
</body>
</html>
